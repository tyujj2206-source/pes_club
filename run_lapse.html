<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMDON.COM | Lapse Chain</title>
<link rel="stylesheet" href="style.css">
<style>
    .chain-page {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
    }
    .chain-title {
        font-size: 36px;
        font-weight: 900;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #00aaff, #00ffe0);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .chain-sub {
        font-size: 14px;
        color: #7d93b8;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 30px;
    }
    #out {
        background: rgba(5, 7, 14, 0.8);
        border: 1px solid rgba(120, 180, 255, 0.2);
        border-radius: 12px;
        padding: 20px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        color: #a9c1e6;
        text-align: left;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        backdrop-filter: blur(10px);
    }
    .ok { color: #3ddc97; }
    .bad { color: #ff4d6d; }
    .warn { color: #ffb066; }
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="background.mp4" type="video/mp4">
</video>
<div class="video-overlay"></div>

<div class="shell">
    <header class="topbar">
        <div class="brand">
            <div class="brand-logo">H</div>
            <div class="brand-text">
                <span class="brand-name">HAMDON.COM</span>
                <span class="brand-sub">Lapse Chain</span>
            </div>
        </div>
        <div class="badge">11.00 - 12.02</div>
    </header>

    <main class="wrap">
        <div class="chain-page">
            <h1 class="chain-title">Lapse Exploit</h1>
            <p class="chain-sub">Firmware 11.00 - 12.02</p>
            <div id="state" class="status-text loading">⏳ Please wait...</div>
            <div id="out"></div>
        </div>
    </main>

    <footer class="foot">
        <p>❤️ Special thanks to all scene developers</p>
    </footer>
</div>

<script type="module">
    var bgVideo = document.getElementById('bg-video');
    if (bgVideo) {
        bgVideo.addEventListener('error', function() { bgVideo.style.display = 'none'; });
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) bgVideo.pause();
            else bgVideo.play().catch(function() {});
        });
    }
    import "./chain_lapse.js";
</script>
</body>
</html>
